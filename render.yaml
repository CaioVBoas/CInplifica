# Render Blueprint para o CInplifica (deploy single-origin: a API serve o front).
# Cria 1 web service (Node) + 1 PostgreSQL gratuito.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: cinplifica-db
    databaseName: cinplifica
    user: cinplifica
    plan: free
    region: oregon

services:
  - type: web
    name: cinplifica
    runtime: node
    plan: free
    region: oregon
    branch: deploy
    healthCheckPath: /health
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter api exec prisma generate &&
      pnpm --filter web build &&
      pnpm --filter api build
    startCommand: >-
      pnpm --filter api exec prisma migrate deploy &&
      pnpm --filter api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cinplifica-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: cin.ufpe.br
      # Preencha estes dois no painel da Render depois de criar o app Google OAuth.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # FRONTEND_URL e GOOGLE_CALLBACK_URL são derivados automaticamente de
      # RENDER_EXTERNAL_URL (ver apps/api/src/config/env.ts), não precisa setar.
